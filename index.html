
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMEVHYD | Hyderabad EV Rentals</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b09;color:white;font-family:Arial,sans-serif}
header{padding:25px;background:#101710;border-bottom:2px solid #39ff14}
.logo{font-size:32px;font-weight:900;color:#39ff14}
.tag{color:#ccc;margin-top:6px}
main{max-width:650px;margin:30px auto;padding:20px}
h1{font-size:28px}
.green{color:#39ff14}
.card{background:#121a14;border:1px solid #29452c;border-radius:15px;padding:22px;margin:20px 0}
input{width:100%;padding:14px;margin:10px 0;background:#080b09;color:white;border:1px solid #456348;border-radius:8px}
button{width:100%;padding:15px;background:#39ff14;color:#071007;font-weight:bold;border:0;border-radius:9px;margin-top:10px;font-size:16px}
footer{text-align:center;color:#888;padding:30px}
</style>
</head>
<body>
<header>
<div class="logo">AIM EV</div>
<div class="tag">APNA HYDERABAD, APNI EV!</div>
</header>
<main>
<h1>Welcome to <span class="green">AIMEVHYD</span></h1>
<p>Your Hyderabad EV rental portal.</p>

<div class="card">
<h2>Admin Portal</h2>
<p>Manage riders, rentals and collections.</p>
<input type="email" placeholder="Admin email">
<input type="password" placeholder="Password">
<button onclick="alert('Admin authentication setup is next.')">Admin Login</button>
</div>

<div class="card">
<h2>Rider Portal</h2>
<p>Check your rental balance and payments.</p>
<input placeholder="Enter Rider ID">
<button onclick="alert('Rider login setup is next.')">Rider Login</button>
</div>

<div class="card">
<h2>Rental Pricing</h2>
<h1 class="green">₹265 / day</h1>
<p>Five-day prepaid recharge: ₹1,325</p>
</div>
</main>
<footer>AIMEVHYD © 2026 | Hyderabad</footer>
</body>
</html>
