
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMEVHYD | EV Rental Management</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b09;
 color:white;
 font-family:Arial,sans-serif
}
header{
 padding:24px;
 background:#101710;
 border-bottom:2px solid #39ff14
}
.logo{
 font-size:32px;
 font-weight:900;
 color:#39ff14
}
.tag{color:#ccc;margin-top:6px}
main{
 max-width:650px;
 margin:25px auto;
 padding:18px
}
h1{font-size:27px}
.green{color:#39ff14}
.card{
 background:#121a14;
 border:1px solid #29452c;
 border-radius:15px;
 padding:20px;
 margin:18px 0
}
input{
 width:100%;
 padding:14px;
 margin:9px 0;
 background:#080b09;
 color:white;
 border:1px solid #456348;
 border-radius:8px
}
button{
 width:100%;
 padding:15px;
 background:#39ff14;
 color:#071007;
 font-weight:bold;
 border:0;
 border-radius:9px;
 margin-top:10px;
 font-size:16px
}
button:disabled{opacity:.6}
.secondary{background:#263329;color:white}
#message{
 padding:12px;
 border-radius:8px;
 margin-top:12px;
 display:none;
 overflow-wrap:anywhere
}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>

<body>

<header>
<div class="logo">AIM EV</div>
<div class="tag">APNA HYDERABAD, APNI EV!</div>
</header>

<main>

<h1>Welcome to <span class="green">AIMEVHYD</span></h1>
<p>Your Hyderabad EV rental management portal.</p>

<div class="card">
<h2>Admin Portal</h2>
<p>Admin login and fleet management</p>

<input id="adminId" type="text" placeholder="Enter Admin ID">

<input id="password" type="password" placeholder="Enter Password">

<button id="loginBtn">ADMIN LOGIN</button>

<button id="logoutBtn" class="secondary" style="display:none">
LOG OUT
</button>

<div id="message"></div>
</div>

<div class="card">
<h2>Rider Portal</h2>
<p>Rider account and rental balance</p>

<input id="riderId" placeholder="Enter Rider ID">

<button id="riderLoginBtn">RIDER LOGIN</button>

<p id="riderMessage" class="green"></p>
</div>

<div class="card">
<h2>Rental Pricing</h2>
<h1 class="green">₹265 / day</h1>
<p>Five-day prepaid recharge: ₹1,325</p>
</div>

</main>

<footer>AIMEVHYD © 2026 | Hyderabad</footer>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 signOut
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";


const firebaseConfig = {
 apiKey: "AIzaSyAe8jt5WuReBus5hK82zPweuwlLMiYUFAI",
 authDomain: "aimevhyd.firebaseapp.com",
 projectId: "aimevhyd",
 storageBucket: "aimevhyd.firebasestorage.app",
 messagingSenderId: "906534851826",
 appId: "1:906534851826:web:857e6997a0666fca576c6b"
};


// ADMIN DETAILS
const ADMIN_EMAIL = "ik9322603@gmail.com";
const ADMIN_ID = "AIMEVHYD001";
const ADMIN_DOCUMENT_ID = "yfHgTKV0ock3P6bsguOE";


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");


function showMessage(text) {
 message.style.display = "block";
 message.textContent = text;
}


loginBtn.addEventListener("click", async () => {

 const adminId =
 document.getElementById("adminId").value.trim();

 const password =
 document.getElementById("password").value;

 if (!adminId || !password) {
  showMessage("Please enter Admin ID and password.");
  return;
 }

 if (adminId !== ADMIN_ID) {
  showMessage("Invalid Admin ID.");
  return;
 }

 loginBtn.disabled = true;
 loginBtn.textContent = "PLEASE WAIT...";

 try {

  // STEP 1: FIREBASE AUTHENTICATION
  const result = await signInWithEmailAndPassword(
   auth,
   ADMIN_EMAIL,
   password
  );

  // STEP 2: READ THE EXACT ADMIN DOCUMENT
  const adminRef = doc(
   db,
   "admins",
   ADMIN_DOCUMENT_ID
  );

  const adminSnapshot = await getDoc(adminRef);

  if (!adminSnapshot.exists()) {
   await signOut(auth);
   showMessage("Admin document not found. Check the Firestore document ID.");
   return;
  }

  // STEP 3: VERIFY ADMIN DETAILS
  const adminData = adminSnapshot.data();

  const storedEmail = String(adminData.email || "")
   .trim()
   .toLowerCase();

  const loggedInEmail = String(result.user.email || "")
   .trim()
   .toLowerCase();

  const storedAdminId = String(adminData.adminId || "")
   .trim();

  if (
   storedEmail !== loggedInEmail ||
   storedAdminId !== ADMIN_ID
  ) {
   await signOut(auth);
   showMessage("Admin details do not match. Check email and adminId fields.");
   return;
  }

  // STEP 4: SUCCESS
  showMessage("Admin login successful. Welcome to AIMEVHYD!");

  loginBtn.style.display = "none";
  logoutBtn.style.display = "block";

 } catch (error) {

  if (error.code === "permission-denied") {
   showMessage("Firestore permission denied. Admin document read access must be corrected.");
  } else {
   showMessage("Login error: " + error.message);
  }

 } finally {

  loginBtn.disabled = false;
  loginBtn.textContent = "ADMIN LOGIN";

 }

});


logoutBtn.addEventListener("click", async () => {

 try {

  await signOut(auth);

  loginBtn.style.display = "block";
  logoutBtn.style.display = "none";

  document.getElementById("password").value = "";

  showMessage("You have logged out.");

 } catch (error) {

  showMessage("Logout error: " + error.message);

 }

});


document.getElementById("riderLoginBtn")
.addEventListener("click", () => {

 const id =
 document.getElementById("riderId").value.trim();

 document.getElementById("riderMessage").textContent =
 id
 ? "Rider account connection is the next setup step."
 : "Please enter your Rider ID.";

});

</script>

</body>
</html>
